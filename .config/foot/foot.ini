[main]

# Color Theme
# deus gruvbox-dark monokai-pro onehalf-dark
# derp deus gruvbox-dark material-design monokai-pro onehalf-dark srcery zenburn
include=/usr/share/foot/themes/gruvbox-dark

# Font settings
font=IosevkaTerm NF:weight=medium:size=13:fontfeatures=calt
font-bold=IosevkaTerm NF:weight=bold:size=13
font-italic=IosevkaTerm NF:weight=medium:slant=italic:size=13
font-bold-italic=IosevkaTerm NF:weight=bold:slant=italic:size=13

initial-window-size-pixels=1000x600
pad=2x2 center

[scrollback]

lines=5000

[colors]

background=000000
regular6=4abaaf
bright6=4abaaf

alpha=0.6

[key-bindings]

font-increase=Mod1+Shift+k
font-decrease=Mod1+Shift+j
font-reset=Mod1+Shift+0

scrollback-up-page=Control+b
scrollback-up-half-page=Control+u
scrollback-up-line=Mod1+k
scrollback-down-page=Control+f
scrollback-down-half-page=Control+d
scrollback-down-line=Mod1+j
