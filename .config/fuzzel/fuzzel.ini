[main]
font=Iosevka:size=14
dpi-aware=no
width=50
fields=name,generic,comment,categories,filename,keywords
terminal=foot
prompt="❯  "
layer=overlay
lines=6
tabs=2
horizontal-pad=25
vertical-pad=10
inner-pad=5
line-height=40
list-executables-in-path=true

[colors]
background=00000099
prompt=ebdbb2ff
input=ebdbb2ff
text=ebdbb2ff
match=cc241dff
selection=458588ff
selection-text=000000ff
selection-match=cc241dff
border=458588ff

[border]
radius=12
width=3

[dmenu]
exit-immediately-if-empty=yes
