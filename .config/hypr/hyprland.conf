#         Name,       Mode (res@rr),        offset,     scale,  transform,  1=90deg
monitor = VGA-1,      preferred,            1920x0,     1
monitor = DP-1,       preferred,            0x0,        1
monitor = DP-2,       2560x1440,        		0x0,        1.25
monitor = LVDS-1,     preferred,            700x1440,   1
monitor = HTMI-A-3,   preferred,            1920x0,     1
monitor = ,           preferred,            0x0,        1
monitor = Unknown-1,  disable


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = $terminal -w 1200x600 lf
$menu = fuzzel
$browser = mullvad-browser
$VPN_SERVER = ch-zrh-wg-003

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

#exec-once = swww-daemon & swww img $XDG_DATA_HOME/bg
#exec-once = darkman run & wlsunset -l 52.5 -L 13.4 -t 0
#exec-once = pipewire &
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = setwallpaper /home/percy/.local/share/bg
exec-once = mako &
exec-once = waybar &

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16
env = QT_QPA_PLATFORM,wayland

debug {
  disable_logs = false
}

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0 #5
    gaps_out = 0 #10

    border_size = 2 #3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(2cd6ddbf)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false
    resize_corner = 3

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0 #12

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 5
        render_power = 1
        color = rgba(191919ab)
        offset = 2 2
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 16
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    enable_swallow = true
    render_ahead_of_time = false
    disable_splash_rendering = true
    initial_workspace_tracking = 0
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = colemak
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
    workspace_swipe_distance = 100
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Basic Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, P, pseudo, # dwindle
bind = $mainMod SHIFT, T, togglesplit, #dwindle

# Shortcuts and App Launches
bind = $mainMod, ESCAPE, exec, hyprlock
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, [float] $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, R, exec, [float] $fileManager
bind = $mainMod SHIFT, V, exec, cliphist list | $menu --dmenu | cliphist decode | wl-copy
bind = $mainMod, V, exec, wg-quick up $VPN_SERVER && notify-send "Successfull!" "Connected to $VPN_SERVER" || notify-send --urgency=2 "Failure!" "Could not connect to $VPN_SERVER"
bind = $mainMod, M, exec, $terminal ncmpcpp
bind = $mainMod, E, exec, $terminal neomutt
bind = $mainMod SHIFT, E, exec, $terminal abook
bind = $mainMod, W, exec, $browser
bind = $mainMod, N, exec, $terminal vis $HOME/.vimwiki.md
bind = $mainMod, Y, exec, $terminal youtube-viewer
bind = $mainMod, O, exec, keepassmenu
bind = $mainMod, I, exec, signal-desktop
bind = $mainMod, F8, exec, mbsync -a
bind = $mainMod, F9, exec, mounter
bind = $mainMod, F10, exec, unmounter
bind = $mainMod, F11, exec, [pin] mpv --untimed --no-cache --no-osc --no-input-default-bindings --profile=low-latency --input-conf=/dev/null --title=webcam $(ls /dev/video[0,2,4,6,8] | tail -n 1)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" -o $HOME/Images/Screenshots
bind = $mainMod CONTROL, S, exec, hyprshot -m active -m output -o $HOME/Images/Screenshots/

# Move focus with mainMod + vim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Moving windows with mainMod + shift + vim keys
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, L, swapwindow, r

# Resizing (floating) windows
binde = $mainMod CONTROL, H, resizeactive, -25 0
binde = $mainMod CONTROL, J, resizeactive, 0 25
binde = $mainMod CONTROL, K, resizeactive, 0 -25
binde = $mainMod CONTROL, L, resizeactive, 25 0

# Moving floating window
binde = $mainMod SHIFT, H, moveactive, -25 0
binde = $mainMod SHIFT, J, moveactive, 0 25
binde = $mainMod SHIFT, K, moveactive, 0 -25
binde = $mainMod SHIFT, L, moveactive, 25 0
bind = $mainMod SHIFT, C, centerwindow,


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Music Control
bind = $mainMod, P, exec, playerctl play-pause
bind = $mainMod, COMMA, exec, playerctl previous
bind = $mainMod SHIFT, COMMA, exec, playerctl position 0%
bind = $mainMod, PERIOD, exec, playerctl next
bind = $mainMod SHIFT, PERIOD, exec, playerctl loop
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

# Audio Control
binde = , XF86AudioRaiseVolume, exec, amixer set Master 5%+
binde = $mainMod, EQUAL, exec, amixer set Master 5%+
binde = $mainMod SHIFT, EQUAL, exec, amixer set Master 15%+
binde = , XF86AudioLowerVolume, exec, amixer set Master 5%-
binde = $mainMod, MINUS, exec, amixer set Master 5%-
binde = $mainMod SHIFT, MINUS, exec, amixer set Master 15%-
bind = , XF86AudioMute, exec, amixer set Master toggle-mute
bind = , XF86AudioMicMute, exec, amixer -c 0 set Capture toggle

# Brightness Control
binde = , XF86MonBrightnessUp, exec, brightnessctl -d acpi_video0 set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl -d acpi_video0 set 5%-

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrule = float, ^(mpv)$
windowrule = float, ^(imv)$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

windowrulev2 = float, class:float
