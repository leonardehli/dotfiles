general {
  grace = 1
  ignore_empty_input = true
  immediate_render = true
  fail_timeout = 500
}

background {
  monitor =
  path = $HOME/.local/share/bg
  blur_size = 7
  blur_passes = 2
  noise = 0.0117
}

input-field {
  monitor =
  size = 250, 30
  outline_thickness = 2
# Scale of input-field height, 0.2 - 0.8
  dots_size = 0.25
# Scale of dots' absolute size, 0.0 - 1.0
  dots_spacing = 0.15 
  dots_center = true
  outer_color = $color6
  inner_color = $color1
  font_color = $color12
#  fade_on_empty = true
# Text rendered in the input box when it's empty.
  placeholder_text = <i>Password...</i>
  hide_input = false
  position = 0, -150
  halign = center
  valign = center
}

# User
label {
  monitor =
  text =    $USER
  color = $color12
  font_size = 22
  font_family = Inter Display Medium

  position = 0, -50
  halign = center
  valign = center
}

image {
  monitor =
  path = 
  size = 230
  rounding = -1
  border_size = 2
  border_color = $color11
  rotate = 0
  reload_time = -1
  position = 0, 100
  halign = center
  valign = center
  }
