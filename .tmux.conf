# ── Basic Preferences ──
set -g prefix C-Space                       # Use Ctrl‑A as prefix (try C-b if you prefer)
unbind C-b                              # Unbind default
set -g base-index 1                     # Windows start at 1
setw -g pane-base-index 1               # Panes start at 1
set -g mouse on                         # Mouse support
setw -g mode-keys vi                    # Vim keys in copy mode :contentReference[oaicite:1]{index=1}
set -g xterm-keys on                    # Allow xterm-style keycodes :contentReference[oaicite:2]{index=2}

# ── Reload config quickly ──
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ── Split windows ──
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# ── Vim-like pane navigation ──
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

